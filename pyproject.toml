[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryhooker"
version = "0.3.3"
description = "Local-first memory reminders and retrieval for coding-agent hooks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "ellmos-ai contributors" }]
keywords = [
    "memory", "llm-agent", "hook", "gardener", "fts5", "claude-code", "offline-first", "usmc",
    "ellmos-ai", "open-bricks", "local-first", "zero-egress", "prompt-injection", "context-triggers",
    "agent-framework", "sqlite", "python", "developer-tools", "session-state", "runasinvoker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hook-master @ git+https://github.com/ellmos-ai/hook-master.git@f9dcea5",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/memoryhooker#readme"
Repository = "https://github.com/ellmos-ai/memoryhooker"
Documentation = "https://github.com/ellmos-ai/memoryhooker#readme"
Issues = "https://github.com/ellmos-ai/memoryhooker/issues"
Changelog = "https://github.com/ellmos-ai/memoryhooker/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/memoryhooker/blob/main/SECURITY.md"
Notice = "https://github.com/ellmos-ai/memoryhooker/blob/main/NOTICE"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/ellmos-ai/memoryhooker/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/memoryhooker/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text Licenses" = "https://github.com/ellmos-ai/memoryhooker/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/memoryhooker/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/memoryhooker/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/memoryhooker/blob/main/llms.txt"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.4.0"]

[project.scripts]
memoryhooker = "memoryhooker.cli:main"

[tool.setuptools.packages.find]
include = ["memoryhooker*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --basetemp=.pytest_temp"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = [".pytest_temp", ".hypothesis", ".turbo", ".nyc_output", ".tox", "build", "dist", ".git", ".venv"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "E402"]
