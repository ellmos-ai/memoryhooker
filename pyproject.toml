[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryhooker"
version = "0.2.1"
description = "Local-first memory reminders and retrieval for coding-agent hooks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ellmos-ai contributors" }]
keywords = ["memory", "llm-agent", "hook", "gardener", "fts5", "claude-code", "offline-first"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
memoryhooker = "memoryhooker.cli:main"

[tool.setuptools.packages.find]
include = ["memoryhooker*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
