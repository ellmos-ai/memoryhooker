<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    
    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing Background Orbs -->
  <circle cx="950" cy="220" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow-cyan)"/>
  <circle cx="820" cy="420" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow-purple)"/>

  <!-- Left Content Area -->
  <g transform="translate(90, 0)">
    <!-- Badge -->
    <g transform="translate(0, 160)">
      <rect width="215" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="107.5" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ELLMOS AI • AGENT HOOK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="260" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#title-grad)" letter-spacing="-1">MemoryHooker</text>

    <!-- Tagline -->
    <text x="0" y="315" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Agent-Agnostic Session Recall Hook for LLM CLIs</text>

    <!-- Subtitle / Short Description -->
    <text x="0" y="348" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748b">Injects relevant local memories into Claude Code, Codex &amp; Kimi prompts</text>

    <!-- Feature Badges/Pills -->
    <g transform="translate(0, 415)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="19" r="4" fill="#38bdf8"/>
        <text x="35" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">FTS5 &amp; Markdown</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="19" r="4" fill="#c084fc"/>
        <text x="35" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Zero-Latency Hook</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(390, 0)">
        <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="19" r="4" fill="#2dd4bf"/>
        <text x="35" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">100% Local First</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic Motif: Memory Nodes & Neural Layer Recall Structure -->
  <g transform="translate(740, 110)">
    <!-- Outer Decorative Orbit Circles -->
    <circle cx="220" cy="200" r="190" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6"/>
    <circle cx="220" cy="200" r="140" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Neural Recall / Layer Connections -->
    <!-- Layer Lines -->
    <path d="M 100 120 L 220 70 L 340 120 L 340 280 L 220 330 L 100 280 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Central Memory Core Diamond -->
    <polygon points="220,130 290,200 220,270 150,200" fill="url(#glow-teal)" opacity="0.25"/>
    <polygon points="220,130 290,200 220,270 150,200" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.8"/>

    <polygon points="220,160 255,200 220,240 185,200" fill="url(#accent-purple)" opacity="0.4"/>
    <polygon points="220,160 255,200 220,240 185,200" fill="none" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Memory Core Center Sphere -->
    <circle cx="220" cy="200" r="14" fill="#38bdf8" filter="url(#glow-cyan)"/>
    <circle cx="220" cy="200" r="7" fill="#ffffff"/>

    <!-- Network Memory Nodes -->
    <!-- Node Top -->
    <line x1="220" y1="70" x2="220" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="220" cy="70" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="220" cy="70" r="3" fill="#38bdf8"/>

    <!-- Node Right Top -->
    <line x1="340" y1="120" x2="290" y2="200" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="340" cy="120" r="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="340" cy="120" r="4" fill="#c084fc"/>

    <!-- Node Right Bottom -->
    <line x1="340" y1="280" x2="290" y2="200" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="340" cy="280" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="340" cy="280" r="3" fill="#38bdf8"/>

    <!-- Node Bottom -->
    <line x1="220" y1="330" x2="220" y2="270" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="220" cy="330" r="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="220" cy="330" r="4" fill="#2dd4bf"/>

    <!-- Node Left Bottom -->
    <line x1="100" y1="280" x2="150" y2="200" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="100" cy="280" r="8" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="100" cy="280" r="3" fill="#c084fc"/>

    <!-- Node Left Top -->
    <line x1="100" y1="120" x2="150" y2="200" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="100" cy="120" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="100" cy="120" r="4" fill="#38bdf8"/>

    <!-- Pulse Signal Rings / Wave Recall Lines -->
    <path d="M 120 180 Q 220 140 320 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M 140 220 Q 220 260 300 220" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
